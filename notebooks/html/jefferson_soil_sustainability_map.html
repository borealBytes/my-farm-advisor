        #container { display: flex; height: 100vh; }

        .layer-btn { padding: 6px 12px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .layer-btn.active { background: #4CAF50; color: white; border-color: #4CAF50; }
        .layer-btn:hover { background: #f0f0f0; }
        .base-layer-controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .base-btn { padding: 6px 12px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .base-btn.active { background: #2196F3; color: white; border-color: #2196F3; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f8f8; font-weight: 600; color: #555; }
        tr { cursor: pointer; }
        tr:hover { background: #f0f8f0; }
        tr.selected { background: #e8f5e9; font-weight: 600; }
        .score-high { color: #2e7d32; }
        .score-low { color: #c62828; }
    </style>

 0.07, "claytotal_r": 10.0, "sandtotal_r": 46.0, "silttotal_r": 44.0, "dbthirdbar_r": 1.56, "cec7_r": 8.2, "field_id": "Ward 123", "k_factor": 5.543, "csp": 50.43, "erosion_risk": 20.156, "om_pct": 0.75, "ph_value": 7.9, "cec_value": 8.2, "composite_score": 0.255}, "geometry": {"type": "Polygon", "coordinates": [[[-112.562507, 44.007881, 0.0], [-112.563707, 44.007496, 0.0], [-112.564846, 44.006963, 0.0], [-112.565816, 44.005957, 0.0], [-112.566234, 44.005216, 0.0], [-112.566191, 44.004234, 0.0], [-112.566216, 44.003263, 0.0], [-112.56552, 44.002204, 0.0], [-112.564713, 44.001552, 0.0], [-112.563864, 44.001106, 0.0], [-112.563183, 44.000914, 0.0], [-112.562536, 44.000743, 0.0], [-112.5619, 44.000686, 0.0], [-112.561147, 44.000676, 0.0], [-112.560517, 44.000714, 0.0], [-112.560021, 44.000789, 0.0], [-112.559283, 44.00096, 0.0], [-112.558554, 44.001219, 0.0], [-112.557885, 44.001597, 0.0], [-112.5574, 44.001971, 0.0], [-112.557033, 44.00231, 0.0], [-112.556803, 44.002622, 0.0], [-112.55646, 44.003248, 0.0], [-112.556432, 44.005299, 0.0], [-112.556878, 44.0061, 0.0], [-112.557518, 44.006736, 0.0], [-112.558354, 44.007255, 0.0], [-112.55911, 44.007602, 0.0], [-112.560117, 44.007831, 0.0], [-112.562507, 44.007881, 0.0]]]}}, {"type": "Feature", "properties": {"id": null, "Name": "Ward 120", "description": null, "timestamp": null, "begin": null, "end": null, "altitudeMode": null, "tessellate": -1, "extrude": 0, "visibility": -1, "drawOrder": null, "icon": null, "mukey": "83922", "muname": "Matheson loam", "compname": "Matheson", "comppct_r": 85, "drainagecl": "Well drained", "hzdept_r": 0.0, "hzdepb_r": 25.0, "om_r": 0.75, "ph1to1h2o_r": 7.9, "awc_r": 0.07, "claytotal_r": 10.0, "sandtotal_r": 46.0, "silttotal_r": 44.0, "dbthirdbar_r": 1.56, "cec7_r": 8.2, "field_id": "Ward 120", "k_factor": 5.543, "csp": 50.43, "erosion_risk": 20.156, "om_pct": 0.75, "ph_value": 7.9, "cec_value": 8.2, "composite_score": 0.255}, "geometry": {"type": "Polygon", "coordinates": [[[-112.5837, 44.007735, 0.0], [-112.584462, 44.007376, 0.0], [-112.585385, 44.006872, 0.0], [-112.585757, 44.006414, 0.0], [-112.586179, 44.005832, 0.0], [-112.586407, 44.005212, 0.0], [-112.586402, 44.003588, 0.0], [-112.586285, 44.003207, 0.0], [-112.585835, 44.002513, 0.0], [-112.585018, 44.001727, 0.0], [-112.583939, 44.001188, 0.0], [-112.582869, 44.000835, 0.0], [-112.579988, 44.000766, 0.0], [-112.579571, 44.000842, 0.0], [-112.578098, 44.001413, 0.0], [-112.577126, 44.002204, 0.0], [-112.576419, 44.00329, 0.0], [-112.576392, 44.003633, 0.0], [-112.576445, 44.005434, 0.0], [-112.576627, 44.005893, 0.0], [-112.576641, 44.005893, 0.0], [-112.577102, 44.006512, 0.0], [-112.577678, 44.007008, 0.0], [-112.579126, 44.007745, 0.0], [-112.580036, 44.008001, 0.0], [-112.582736, 44.00799, 0.0], [-112.5837, 44.007735, 0.0]]]}}]};

const map = L.map('map').setView([43.8943, -112.2946], 12);

const baseLayers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }),
    satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' })
};

let currentBase = 'satellite';
baseLayers.satellite.addTo(map);

let geojsonLayer = null;
let currentLayer = 'om';
let selectedFieldId = null;

const layerConfig = {
    om: { property: 'om_pct', title: 'Organic Matter %', color: ['#f7fcf5', '#c7e9c0', '#74c476', '#31a354', '#006d2c'], domain: [0.15, 2.5] },
    ph: { property: 'ph_value', title: 'pH', color: ['#fff5f0', '#fcbba1', '#fc9272', '#fb6a4a', '#cb181d'], domain: [7.9, 8.8] },
    cec: { property: 'cec_value', title: 'CEC', color: ['#fcfcfc', '#c7e9e0', '#7bccc4', '#43a2ca', '#0868ac'], domain: [2.5, 33] },
    csp: { property: 'csp', title: 'Carbon Storage Potential', color: ['#fff5f0', '#fee0d2', '#fcbba1', '#fc9272', '#de2d26'], domain: [3, 130] },
    erosion: { property: 'erosion_risk', title: 'Erosion Risk', color: ['#f7fcf5', '#c7e9c0', '#74c476', '#31a354', '#006d2c'], domain: [0.1, 15] }
};

function getColor(value, config) {
    if (value === null || value === undefined) return '#cccccc';
    const [min, max] = config.domain;
    const t = Math.max(0, Math.min(1, (value - min) / (max - min)));
    const idx = Math.min(4, Math.floor(t * 5));
    return config.color[idx];
}

function style(feature) {
    const config = layerConfig[currentLayer];
    const value = feature.properties[config.property];
    return { fillColor: getColor(value, config), weight: 1, color: '#666', fillOpacity: 0.7 };
}

function highlightFeature(e) {
    const layer = e.target;
    if (selectedFieldId && (layer.feature.properties.field_id === selectedFieldId || layer.feature.properties.Name === selectedFieldId)) {
        layer.setStyle({ weight: 4, color: '#ff6f00', fillOpacity: 0.9 });
    } else {
        layer.setStyle({ weight: 2, color: '#333', fillOpacity: 0.8 });
    }
}

function resetHighlight(e) {
    if (selectedFieldId && (e.target.feature.properties.field_id === selectedFieldId || e.target.feature.properties.Name === selectedFieldId)) {
        e.target.setStyle({ weight: 4, color: '#ff6f00', fillOpacity: 0.9 });
    } else {
        geojsonLayer.resetStyle(e.target);
    }
}

function zoomToField(fieldId) {
    geojsonLayer.eachLayer(layer => {
        const props = layer.feature.properties;
        if (props.field_id === fieldId || props.Name === fieldId) {
            map.fitBounds(layer.getBounds(), { padding: [50, 50] });
            selectedFieldId = fieldId;
            layer.setStyle({ weight: 4, color: '#ff6f00', fillOpacity: 0.9 });
        }
    });
}

function populateTables(top10, bottom10) {
    const topTbody = document.querySelector('#top10-table tbody');
    const botTbody = document.querySelector('#bottom10-table tbody');
    
    top10.forEach((f, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (i+1) + '</td><td>' + f.field + '</td><td>' + (f.om ?? 'N/A') + '</td><td>' + (f.ph ?? 'N/A') + '</td><td>' + (f.cec ?? 'N/A') + '</td><td class="score-high">' + f.score + '</td>';
        tr.onclick = () => { document.querySelectorAll('tr').forEach(r => r.classList.remove('selected')); tr.classList.add('selected'); zoomToField(f.field); };
        topTbody.appendChild(tr);
    });
    
    bottom10.forEach((f, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (i+1) + '</td><td>' + f.field + '</td><td>' + (f.om ?? 'N/A') + '</td><td>' + (f.ph ?? 'N/A') + '</td><td>' + (f.cec ?? 'N/A') + '</td><td class="score-low">' + f.score + '</td>';
        tr.onclick = () => { document.querySelectorAll('tr').forEach(r => r.classList.remove('selected')); tr.classList.add('selected'); zoomToField(f.field); };
        botTbody.appendChild(tr);
    });
}

function updateLayer(layerName) {
    currentLayer = layerName;
    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-layer="' + layerName + '"]').classList.add('active');
    if (geojsonLayer) { map.removeLayer(geojsonLayer); }
    geojsonLayer = L.geoJSON(soilData, { style: style, onEachFeature: onEachFeature }).addTo(map);
}

const tooltip = L.tooltip({ direction: 'top', sticky: true });

function onEachFeature(feature, l) {
    l.on('mouseover', e => {
        const props = e.target.feature.properties;
        const content = '<strong>' + (props.field_id || props.Name) + '</strong><br>' +
            'OM: ' + (props.om_pct ?? 'N/A') + '%<br>' +
            'pH: ' + (props.ph_value ?? 'N/A') + '<br>' +
            'CEC: ' + (props.cec_value ?? 'N/A') + ' meq/100g<br>' +
            'K-factor: ' + (props.k_factor ?? 'N/A') + '<br>' +
            'Carbon Storage: ' + (props.csp ?? 'N/A') + ' t/ha<br>' +
            'Erosion Risk: ' + (props.erosion_risk ?? 'N/A') + '<br>' +
            'Composite Score: ' + (props.composite_score ?? 'N/A');
        e.target.bindTooltip(content, tooltip).openTooltip();
    });
    l.on('mouseout', e => e.target.closeTooltip());
    l.on('click', () => { selectedFieldId = props.field_id || props.Name; });
}

geojsonLayer = L.geoJSON(soilData, { style: style, onEachFeature: onEachFeature }).addTo(map);

document.querySelectorAll('.layer-btn').forEach(btn => {
    btn.onclick = () => updateLayer(btn.dataset.layer);
});

document.querySelectorAll('.base-btn').forEach(btn => {
    btn.onclick = () => {
        currentBase = btn.dataset.base;
        document.querySelectorAll('.base-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        map.removeLayer(baseLayers.osm);
        map.removeLayer(baseLayers.satellite);
        baseLayers[currentBase].addTo(map);
    };
});

const ranked = soilData.features.map(f => f.properties).sort((a, b) => (b.composite_score || 0) - (a.composite_score || 0));
const top10 = ranked.slice(0, 10).map(p => ({ field: p.field_id || p.Name, om: p.om_pct, ph: p.ph_value, cec: p.cec_value, score: p.composite_score }));
const bottom10 = ranked.slice(-10).reverse().map(p => ({ field: p.field_id || p.Name, om: p.om_pct, ph: p.ph_value, cec: p.cec_value, score: p.composite_score }));
populateTables(top10, bottom10);
</script>
